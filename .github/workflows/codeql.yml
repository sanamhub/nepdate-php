# CodeQL does not support PHP. This workflow scans the GitHub Actions YAML, which is the part of
# the repository CodeQL does support; the PHP security review is the PHPStan gate, the dependency
# review and the Composer audit in SECURITY.md, which says so.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "43 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: actions
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:actions
