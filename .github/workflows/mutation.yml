# Mutation testing (ADR-0006). It runs weekly and by hand, never on a pull request: every mutant
# runs the whole suite, so a full run takes tens of minutes.
name: mutation

on:
  schedule:
    - cron: "17 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: pcov
          tools: composer
      - run: composer install --no-interaction --no-progress --prefer-dist
      - name: Run Infection
        run: |
          set -euo pipefail
          php -d memory_limit=1G vendor/bin/infection \
            --configuration=infection.json5 \
            --threads="$(nproc)" \
            --logger-github=true \
            --no-progress
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: |
            build/infection.log
            build/infection.html
          if-no-files-found: warn
          retention-days: 30
