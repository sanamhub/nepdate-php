# Installs one published version of both packages from Packagist the way a user does, and checks
# them. release.yml calls it after the release; it also runs weekly on Linux and daily as a
# metadata-only check. A scheduled failure opens or updates one issue labelled published-check.
name: verify-published

on:
  workflow_call:
    inputs:
      version:
        description: Published version, or latest for the newest version on Packagist
        required: false
        default: latest
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Published version, or latest for the newest version on Packagist
        required: false
        default: latest
        type: string
  schedule:
    # The weekly install check, Monday 06:41 UTC.
    - cron: "41 6 * * 1"
    # The daily metadata check, which downloads no package archive.
    - cron: "29 3 * * *"

permissions:
  contents: read

jobs:
  resolve:
    name: resolve the version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-latest}"
          if [ "$version" = latest ]; then
            version="$(curl -fsS https://repo.packagist.org/p2/sanamhub/nepdate.json \
              | jq -r '.packages["sanamhub/nepdate"] | map(select(.version | test("-dev$") | not)) | .[0].version')"
            if [ -z "$version" ] || [ "$version" = null ]; then
              echo "::error::Packagist serves no released version of sanamhub/nepdate yet"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Resolved version: \`$version\`" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: verify ${{ needs.resolve.outputs.version }}
    if: github.event_name != 'schedule'
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        php: ["8.3", "8.5"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer
      - name: Install the published packages in a consumer project
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          composer init --no-interaction --name=nepdate/consumer --quiet
          composer require --no-interaction --no-progress \
            "sanamhub/nepdate:${VERSION}" "sanamhub/nepdate-patro:${VERSION}"
      - name: Check the installed packages
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: php scripts/published-smoke.php "$RUNNER_TEMP/consumer/vendor/autoload.php"

  # The weekly check: Linux only, one entry per package manager. Composer is the only manager both
  # packages have, so the matrix has one entry.
  weekly:
    name: weekly ${{ needs.resolve.outputs.version }}
    if: github.event_name == 'schedule' && github.event.schedule == '41 6 * * 1'
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        manager: [composer]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          coverage: none
          tools: composer
      - name: Install the published packages in a consumer project
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          composer init --no-interaction --name=nepdate/consumer --quiet
          composer require --no-interaction --no-progress \
            "sanamhub/nepdate:${VERSION}" "sanamhub/nepdate-patro:${VERSION}"
      - name: Check the installed packages
        run: php scripts/published-smoke.php "$RUNNER_TEMP/consumer/vendor/autoload.php"

  # The daily check: Packagist still lists the version and answers for both archives, with no
  # download, so it cannot look like install traffic.
  metadata:
    name: metadata ${{ needs.resolve.outputs.version }}
    if: github.event_name == 'schedule' && github.event.schedule == '29 3 * * *'
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check the registry listings
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          found=0
          for package in sanamhub/nepdate sanamhub/nepdate-patro; do
            if curl -fsS "https://repo.packagist.org/p2/$package.json" \
              | jq -e --arg v "$VERSION" '.packages["'"$package"'"] | any(.version == $v)' >/dev/null; then
              echo "$package serves $VERSION"
              found=$((found + 1))
            else
              echo "::error::$package does not serve $VERSION on Packagist"
            fi
          done
          test "$found" -eq 2

  # The only job with write access. It reads the failures of the checks and opens or updates one
  # issue; it never installs anything and never touches the registry.
  report:
    name: report
    if: failure() && github.event_name == 'schedule'
    needs: [resolve, verify, weekly, metadata]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Open or update the issue
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title="published-check: nepdate $VERSION"
          body="The scheduled published check failed for \`$VERSION\` (\`$RUN_URL\`). See the run and the \`published-check\` label."
          number="$(gh issue list --label published-check --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --body "$body" --label published-check
          fi
